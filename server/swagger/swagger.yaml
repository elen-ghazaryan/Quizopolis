openapi: 3.0.0
info:
  title: Quiz Application API
  version: 1.0.0
  description: API documentation for Quiz Application

servers:
  - url: http://localhost:4000/api
    description: Development server

paths:
  # ========== AUTH ROUTES ==========
  /auth/signup:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [student, teacher]
      responses:
        '201':
          description: User signed up successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "You've signed up successfully. Now please verify your email to continue"
        '400':
          description: Bad request - validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "All fields are required"
        '500':
          description: Internal server error

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login successful"
        '401':
          description: Invalid credentials or email not verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid credentials for user"
        '500':
          description: Internal server error

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"

  /auth/verify:
    post:
      tags:
        - Authentication
      summary: Verify email with token
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Email successfully verified and logged in"

  /auth/verify/resend:
    post:
      tags:
        - Authentication
      summary: Resend verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Verification email resent to user@example.com"
        '404':
          description: User not found

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Reset link sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "A reset link has been sent"

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password successfully reset"
        '400':
          description: Invalid or expired token

  # ========== USER ROUTES ==========
  /user/profile:
    get:
      tags:
        - User
      summary: Get current user profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Ok"
                  payload:
                    type: object
                    properties:
                      email:
                        type: string
                      username:
                        type: string
                      isEmailVerified:
                        type: boolean
                      role:
                        type: string
                      avatar:
                        type: string
    put:
      tags:
        - User
      summary: Update user profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Ok"
                  payload:
                    type: object
                    properties:
                      user:
                        type: object

  /user/password:
    patch:
      tags:
        - User
      summary: Update password
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password has been successfully changed"
        '400':
          description: Wrong credentials or validation error

  /user/username:
    patch:
      tags:
        - User
      summary: Update username
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newUsername:
                  type: string
      responses:
        '200':
          description: Username updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Username updated successfully"
        '400':
          description: Username is busy

  /user/avatar:
    post:
      tags:
        - User
      summary: Upload avatar
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully updated"
                  payload:
                    type: object
                    properties:
                      picture:
                        type: string

  /user/streak:
    get:
      tags:
        - User
      summary: Get user streak information
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Streak information
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentStreak:
                    type: number
                  lastQuizDate:
                    type: string
                    format: date-time
                  longestStreak:
                    type: number

  /user/stats:
    get:
      tags:
        - User
      summary: Get user statistics
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalQuizzes:
                    type: number
                  averageScore:
                    type: number
                  bestScore:
                    type: number
                  averageTime:
                    type: number
                  totalTime:
                    type: number
                  accuracy:
                    type: number
                  correctAnswers:
                    type: number
                  totalQuestions:
                    type: number
                  strongestCategory:
                    type: string
                  weakestCategory:
                    type: string
                  lastQuizDate:
                    type: string
                    format: date-time
                  quizzesThisMonth:
                    type: number
        '500':
          description: Failed to fetch stats

  /user/{id}/favorites:
    post:
      tags:
        - User
      summary: Add quiz to favorites
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quizId:
                  type: string
      responses:
        '200':
          description: Quiz added to favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quiz added to favorites"
                  payload:
                    type: object
                    properties:
                      favorites:
                        type: array
                        items:
                          type: string
        '404':
          description: User not found
        '500':
          description: Internal server error
    get:
      tags:
        - User
      summary: Get all favorite quizzes
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Favorites retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        difficulty:
                          type: string
                        category:
                          type: string
                        points:
                          type: number
                        createdAt:
                          type: string
                          format: date-time
        '404':
          description: User not found

  /user/{id}/favorites/{quizId}:
    delete:
      tags:
        - User
      summary: Remove quiz from favorites
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quiz removed from favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quiz removed from favorites"
                  payload:
                    type: object
                    properties:
                      favorites:
                        type: array
                        items:
                          type: string
        '404':
          description: User not found

# ========== QUIZ ROUTES ==========
  /quiz:
    get:
      tags:
        - Quiz
      summary: Get all published standard quizzes
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All published quizzes retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "All published standard quizzes"
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        category:
                          type: string
                        difficulty:
                          type: string
                        createdBy:
                          type: object
                          properties:
                            username:
                              type: string
                            avatar:
                              type: string
                        questionCount:
                          type: number
                        createdAt:
                          type: string
                          format: date-time
        '500':
          description: Server error

  /quiz/history/standard:
    get:
      tags:
        - Quiz
      summary: Get standard quiz history
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Standard quiz history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Standard quizzes history retrieved successfully"
                  payload:
                    type: object
                    properties:
                      history:
                        type: array
                        items:
                          type: object
        '500':
          description: Error retrieving history

  /quiz/history/live:
    get:
      tags:
        - Quiz
      summary: Get live quiz history
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Live quiz history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Live quizzes history retrieved successfully."
                  payload:
                    type: object
                    properties:
                      history:
                        type: array
                        items:
                          type: object
        '500':
          description: Error retrieving history

  /quiz/{id}:
    get:
      tags:
        - Quiz
      summary: Get quiz by ID
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quiz retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quiz retrieved"
                  payload:
                    type: object
                    properties:
                      quiz:
                        type: object
                        properties:
                          _id:
                            type: string
                          title:
                            type: string
                          description:
                            type: string
                          category:
                            type: string
                          difficulty:
                            type: string
                          mode:
                            type: string
                          createdBy:
                            type: object
                          questions:
                            type: array
                            items:
                              type: object
                          comments:
                            type: array
                            items:
                              type: object
        '400':
          description: Invalid quiz ID
        '404':
          description: Quiz not found
        '500':
          description: Internal server error

  /quiz/comments:
    post:
      tags:
        - Quiz
      summary: Add comment to quiz
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Comment added"
                  payload:
                    type: object
                    properties:
                      comment:
                        type: object
        '400':
          description: Comment text cannot be empty
        '500':
          description: Internal server error

  /quiz/{quizId}/comments:
    get:
      tags:
        - Quiz
      summary: Get all comments for a quiz
      security:
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comments retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Comments retrieved"
                  payload:
                    type: object
                    properties:
                      comments:
                        type: array
                        items:
                          type: object
        '500':
          description: Internal server error

  /quiz/{quizId}/comments/{commentId}:
    patch:
      tags:
        - Quiz
      summary: Update comment
      security:
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Comment updated"
                  payload:
                    type: object
                    properties:
                      comment:
                        type: object
        '400':
          description: Comment text cannot be empty
        '403':
          description: Not authorized
        '404':
          description: Comment not found
        '500':
          description: Internal server error
    delete:
      tags:
        - Quiz
      summary: Delete comment
      security:
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Comment deleted"
                  payload:
                    type: object
                    properties:
                      id:
                        type: string
        '403':
          description: Not authorized
        '404':
          description: Comment not found
        '500':
          description: Internal server error

  /quiz/{id}/take:
    get:
      tags:
        - Quiz
      summary: Start quiz attempt
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Quiz attempt started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quiz attempt started"
                  payload:
                    type: object
                    properties:
                      attempt:
                        type: object
                        properties:
                          attemptId:
                            type: string
                          quizId:
                            type: string
                          startedAt:
                            type: string
                            format: date-time
                          totalPoints:
                            type: number
                      questions:
                        type: array
                        items:
                          type: object
        '400':
          description: Already has in-progress attempt
        '404':
          description: Quiz not found
        '500':
          description: Internal server error

  /quiz/attempt/{attemptId}/answer:
    post:
      tags:
        - Quiz
      summary: Save draft answer
      security:
        - cookieAuth: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                questionId:
                  type: string
                selectedOptions:
                  type: array
                  items:
                    type: number
                textAnswer:
                  type: string
      responses:
        '200':
          description: Answer saved as draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Answer saved as draft"
                  questionId:
                    type: string
                  totalAnswered:
                    type: number
        '404':
          description: Attempt not found
        '500':
          description: Internal server error

  /quiz/attempt/{attemptId}/submit:
    post:
      tags:
        - Quiz
      summary: Submit quiz
      security:
        - cookieAuth: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quiz submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quiz submitted successfully"
                  payload:
                    type: object
                    properties:
                      score:
                        type: number
                      totalPoints:
                        type: number
                      percentage:
                        type: number
                      timeSpent:
                        type: number
                      correctAnswers:
                        type: number
                      totalQuestions:
                        type: number
        '400':
          description: No answers found
        '404':
          description: Attempt not found
        '500':
          description: Internal server error

  /quiz/attempt/{attemptId}/resume:
    get:
      tags:
        - Quiz
      summary: Resume quiz attempt
      security:
        - cookieAuth: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quiz resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quiz resumed"
                  attempt:
                    type: object
                  draftAnswers:
                    type: object
                  questions:
                    type: array
                    items:
                      type: object
        '404':
          description: Attempt not found
        '500':
          description: Internal server error

  /quiz/{quizId}/restart:
    post:
      tags:
        - Quiz
      summary: Restart quiz attempt
      security:
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Quiz restarted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quiz restarted successfully"
                  attemptId:
                    type: string
                  questions:
                    type: array
                    items:
                      type: object
        '500':
          description: Internal server error

  /quiz/{id}/live/start:
    post:
      tags:
        - Quiz - Live
      summary: Start live quiz session (Teacher only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Live quiz lobby opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Live quiz lobby opened"
                  payload:
                    type: object
                    properties:
                      quiz:
                        type: object
                        properties:
                          _id:
                            type: string
                          title:
                            type: string
                          accessCode:
                            type: string
                          isActive:
                            type: boolean
                          totalQuestions:
                            type: number
        '400':
          description: Quiz is not in live mode or already running
        '403':
          description: Unauthorized
        '404':
          description: Quiz not found
        '500':
          description: Internal server error

  /quiz/{id}/live/join:
    post:
      tags:
        - Quiz - Live
      summary: Join live quiz (Student)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessCode:
                  type: string
      responses:
        '200':
          description: Successfully joined quiz
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully joined quiz"
                  quiz:
                    type: object
                    properties:
                      _id:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      totalQuestions:
                        type: number
                      quizStarted:
                        type: boolean
        '400':
          description: Quiz session not active or already started
        '404':
          description: Quiz not found
        '500':
          description: Internal server error

  # ========== ADMIN QUIZ ROUTES ==========
  /admin/quiz:
    post:
      tags:
        - Admin - Quiz
      summary: Create quiz (Teacher only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                difficulty:
                  type: string
                  enum: [easy, medium, hard]
                mode:
                  type: string
                  enum: [standard, live]
                isPublished:
                  type: boolean
      responses:
        '201':
          description: Quiz created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Standard quiz created successfully."
                  payload:
                    type: object
                    properties:
                      quiz:
                        type: object
        '400':
          description: Validation error
        '500':
          description: Server error

  /admin/quiz/published:
    get:
      tags:
        - Admin - Quiz
      summary: Get own published quizzes (Teacher only)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All published quizzes
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "All published quizzes"
                  payload:
                    type: object
                    properties:
                      quizzes:
                        type: array
                        items:
                          type: object
        '500':
          description: Internal server error

  /admin/quiz/unpublished:
    get:
      tags:
        - Admin - Quiz
      summary: Get own draft quizzes (Teacher only)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All unpublished quizzes
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "All unpublished quizzes"
