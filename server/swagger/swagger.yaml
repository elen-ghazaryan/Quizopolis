  /admin/quiz/{id}:
    get:
      tags:
        - Admin - Quiz
      summary: Get quiz by ID (admin view)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Quiz ID
