  # ==================== ADMIN - QUIZ ====================
  /admin/quiz:
    post:
      tags:
        - Admin - Quiz
      summary: Create a new quiz (Teacher only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - category
                - difficulty
              properties:
                title:
                  type: string
                  example: "Advanced JavaScript"
                description:
                  type: string
                  example: "Test your advanced JS knowledge"
                category:
                  type: string
                  example: "programming"
                difficulty:
                  type: string
                  enum: [easy, medium, hard]
                  example: "hard"
                mode:
                  type: string
                  enum: [standard, live]
                  default: standard
                isPublished:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Quiz created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Standard quiz created successfully."
                  payload:
                    type: object
                    properties:
                      quiz:
                        $ref: '#/components/schemas/Quiz'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Teacher role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/quiz/published:
    get:
      tags:
        - Admin - Quiz
      summary: Get own published quizzes (Teacher only)
