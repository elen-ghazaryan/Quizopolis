  # ==================== QUESTIONS ====================
  /admin/quiz/{quizId}/questions:
    post:
      tags:
        - Admin - Quiz
      summary: Add question to quiz
      security:
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - questionText
                - questionType
              properties:
                questionText:
                  type: string
                  example: "What is a closure?"
                questionType:
                  type: string
                  enum: [multiple-choice, true-false, short-answer]
                  example: "multiple-choice"
                options:
                  type: string
                  description: JSON string of options array
                  example: '[{"text":"Option 1","isCorrect":true},{"text":"Option 2","isCorrect":false}]'
                correctAnswer:
                  type: string
                  example: "For true-false or short-answer"
                points:
                  type: number
                  default: 1
                  example: 10
                explanation:
                  type: string
                  example: "Explanation of the answer"
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Question added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  payload:
                    $ref: '#/components/schemas/Question'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Admin - Quiz
      summary: Get all questions for a quiz
      security:
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Questions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  payload:
                    type: object
                    properties:
                      questions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Question'

